name: Release admission regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release-admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # One run per workflow+ref. When called from publish-images.yml,
    # github.workflow is the caller's name, so the gate never cancels the
    # standalone run (or vice versa). Only superseded PR runs are cancelled;
    # main runs always finish because they gate publishing.
    concurrency:
      group: ${{ github.workflow }}-release-admission-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-release.txt
      - name: Check immutable release admission and compatibility
        run: python -m unittest discover -s tests -p test_secure_release.py -v
      - name: Check release entry point syntax
        run: |
          python -m py_compile scripts/secure_release.py
          bash -n scripts/deploy-prod.sh
          bash -n scripts/auto-deploy.sh
