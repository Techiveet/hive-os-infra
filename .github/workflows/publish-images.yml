name: Publish scanned infrastructure images
on:
  push:
    branches: [main]
  workflow_dispatch:
# Least privilege by default; only the publish job may write packages.
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/release-admission.yml
    permissions:
      contents: read
  publish:
    needs: security
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ffmpeg
            context: ./ffmpeg-api
            file: ./ffmpeg-api/Dockerfile
          - name: video-backend
            context: ./video-backend
            file: ./video-backend/Dockerfile
          - name: seaweedfs-bootstrap
            context: ./seaweedfs-bootstrap
            file: ./seaweedfs-bootstrap/Dockerfile
          - name: caddy
            context: .
            file: ./Dockerfile.caddy
    env:
      IMAGE: ghcr.io/techiveet/hive-${{ matrix.name }}
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # 1. Build the candidate locally only: nothing reaches GHCR before it is scanned.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: candidate
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Techiveet/hive-os-infra
          outputs: type=docker,dest=${{ runner.temp }}/candidate.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Restore Trivy vulnerability database
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}-${{ matrix.name }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      # 2. Scan the exact local candidate archive.
      - name: Scan candidate before publishing
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress --cache-dir /root/.cache/trivy --input /scan/candidate.tar
          # The container writes the DB as root; make it readable for the cache save step.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/trivy"
      # 3. Only a candidate that passed the scan is pushed, byte-for-byte.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned candidate
        run: |
          docker load --input "$RUNNER_TEMP/candidate.tar"
          docker push "$IMAGE:$GITHUB_SHA"
          REFERENCE="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$GITHUB_SHA" | grep -m1 "^$IMAGE@sha256:")"
          test -n "$REFERENCE"
          jq -n --arg image "$REFERENCE" --arg commit "$GITHUB_SHA" \
            '{image: $image, source_revision: $commit}' > candidate.json
          rm -f "$RUNNER_TEMP/candidate.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infra-image-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
