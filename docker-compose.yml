services:
  # 1. CACHE (Redis)
  redis:
    image: redis:alpine
    container_name: hive-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 2. DATABASE (Postgres 17)
  db:
    image: postgres:17-alpine
    container_name: hive-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    volumes:
      - hive-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 3. SEARCH (Meilisearch)
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: hive-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set in .env}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - hive-search-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 4. EMAIL CATCHER (Mailpit)
  mailpit:
    image: axllent/mailpit
    container_name: hive-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:11025:1025" # SMTP Port
      - "127.0.0.1:8085:8025" # Web Dashboard Port
    networks:
      - hive-network

  # 🚀 5. AI BACKGROUND REMOVAL (rembg)
  rembg:
    image: danielgatis/rembg:latest
    container_name: hive-ai-rembg
    profiles:
      - ai
    restart: unless-stopped
    # Add the host and port flags to force it to listen externally
    command: s --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:${REMBG_HOST_PORT:-15001}:5000"
    networks:
      - hive-network

  # 6. OBJECT STORAGE (SeaweedFS)
  seaweedfs:
    image: chrislusf/seaweedfs:3.94
    container_name: hive-seaweedfs
    restart: unless-stopped
    command: server -dir=/data -s3
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_HOST_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_FILER_HOST_PORT:-8888}:8888"
      - "127.0.0.1:${SEAWEEDFS_MASTER_HOST_PORT:-9333}:9333"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
    volumes:
      - hive-seaweedfs-data:/data
    networks:
      - hive-network

  seaweedfs-bootstrap:
    image: minio/mc:latest
    container_name: hive-seaweedfs-bootstrap
    depends_on:
      seaweedfs:
        condition: service_started
    restart: "no"
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
    entrypoint: >
      /bin/sh -ec "
      until mc alias set local http://seaweedfs:8333 ${SEAWEEDFS_ACCESS_KEY:-seaweedfs} ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret} >/dev/null 2>&1; do
        sleep 2;
      done &&
      mc mb --ignore-existing local/${SEAWEEDFS_BUCKET:-hive-local} >/dev/null 2>&1 || true
      "
    networks:
      - hive-network

  seaweedfs-browser:
    image: cloudlena/s3manager:v0.5.0
    container_name: hive-seaweedfs-browser
    profiles:
      - storage-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEAWEEDFS_BROWSER_HOST_PORT:-9091}:8080"
    environment:
      ENDPOINT: seaweedfs:8333
      REGION: us-east-1
      ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
      USE_SSL: "false"
      SIGNATURE_TYPE: V4
      FORCE_DOWNLOAD: "false"
      ALLOW_DELETE: "true"
    depends_on:
      seaweedfs:
        condition: service_started
      seaweedfs-bootstrap:
        condition: service_completed_successfully
    networks:
      - hive-network

  # 7. THE BRAIN (Laravel 13 + Octane)
  backend:
    build:
      context: ../hive-os-backend
      dockerfile: Dockerfile
    container_name: hive-backend
    restart: unless-stopped
    # Rebuild the Laradocs search index on boot (see ../hive-os-backend/docker/entrypoint.sh)
    # so a Docker restart never leaves /hivedocs search empty. Matches the image
    # ENTRYPOINT in ../hive-os-backend/Dockerfile; overridden here so the live
    # stack gets it without an image rebuild.
    # WSL bind mounts don't honor the exec bit, so run the script via sh.
    entrypoint: ["sh", "/var/www/html/docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - ../hive-os-backend:/var/www/html
      - hive-backend-storage:/var/www/html/storage
    environment:
      APP_NAME: "Hive ERP"
      APP_ENV: local
      APP_DEBUG: "${APP_DEBUG:-false}"
      # Laraowl is optional. Do not emit failing telemetry unless a reachable
      # monitoring server has been deliberately configured for this stack.
      LARAOWL_ENABLED: "${LARAOWL_ENABLED:-false}"
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      APP_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:3001
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      OCTANE_SERVER: roadrunner
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set in .env}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: s3
      MEDIA_DISK: s3
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_URL: http://localhost:${SEAWEEDFS_S3_HOST_PORT:-8333}/${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ROOT_PREFIX: media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      WATCHPACK_POLLING: "true"
      GOTENBERG_URL: http://gotenberg:3000
      FFMPEG_URL: http://ffmpeg:9090
      # 📡 REAL-TIME BROADCASTING
      REVERB_APP_ID: "326162"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      REVERB_PORT: "9000"
      REVERB_SCHEME: "http"
      NEXT_PUBLIC_REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      NEXT_PUBLIC_REVERB_HOST: "localhost"
      NEXT_PUBLIC_REVERB_PORT: "9095"
      NEXT_PUBLIC_REVERB_SCHEME: "http"
      # 🚀 TELL LARAVEL WHERE REVERB LIVES IN DOCKER
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
      PUSHER_APP_ID: "326162"
      PUSHER_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      PUSHER_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      PUSHER_PORT: "9000"
      PUSHER_SCHEME: "http"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      seaweedfs-bootstrap:
        condition: service_completed_successfully
      ffmpeg:
        condition: service_healthy
    command: php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000
    networks:
      hive-network:
        aliases:
          # Every seeded demo tenant gets a *.localhost alias so docker-internal
          # services can reach the backend by tenant hostname and the tenant
          # subdomain preview (http://<id>.localhost:3001) is consistent.
          # Keep in sync with Modules/Tenancy/database/seeders/TenantsSeeder.php
          # (ids) and the `domains` table (each tenant needs a <id>.localhost
          # domain record for Host-header resolution).
          - afya-clinic.localhost
          - apple.localhost
          - aquauno.localhost
          - global-b2b.localhost
          - harrawefarm.localhost
          - lanouveil.localhost
          - lms-demo.localhost # Aster Learning Academy (LMS academy demo)
          - nile-suites.localhost
          - savory-lounge.localhost
          - selam-bistro.localhost
          - techive.localhost
          - tesla.localhost
          # Legacy alias — no seeded tenant with id 'spacex'; kept for
          # compatibility.
          - spacex.localhost

  # 8. THE WORKER (Background Jobs)
  queue:
    build:
      context: ../hive-os-backend
      dockerfile: Dockerfile
    container_name: hive-queue
    restart: unless-stopped
    volumes:
      - ../hive-os-backend:/var/www/html
      - hive-backend-storage:/var/www/html/storage
    environment:
      APP_NAME: "Hive ERP"
      APP_ENV: local
      LARAOWL_ENABLED: "${LARAOWL_ENABLED:-false}"
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set in .env}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REVERB_APP_ID: "326162"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      REVERB_PORT: "9000"
      REVERB_SCHEME: "http"
      FILESYSTEM_DISK: s3
      MEDIA_DISK: s3
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_URL: http://localhost:${SEAWEEDFS_S3_HOST_PORT:-8333}/${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ROOT_PREFIX: media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      # 🚀 TELL THE WORKER WHERE REVERB LIVES (For queued broadcasts)
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
      PUSHER_APP_ID: "326162"
      PUSHER_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      PUSHER_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      PUSHER_PORT: "9000"
      PUSHER_SCHEME: "http"
      FRONTEND_URL: http://localhost:3001
      FFMPEG_URL: http://ffmpeg:9090
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      seaweedfs-bootstrap:
        condition: service_completed_successfully
      ffmpeg:
        condition: service_healthy
    command: php artisan horizon
    networks:
      - hive-network

  # 8b. THE SCHEDULER (Laravel Scheduler)
  scheduler:
    build:
      context: ../hive-os-backend
      dockerfile: Dockerfile
    container_name: hive-scheduler
    restart: unless-stopped
    environment:
      APP_NAME: "Hive ERP"
      APP_ENV: local
      LARAOWL_ENABLED: "${LARAOWL_ENABLED:-false}"
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      OCTANE_SERVER: roadrunner
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set in .env}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: s3
      MEDIA_DISK: s3
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_URL: http://localhost:${SEAWEEDFS_S3_HOST_PORT:-8333}/${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ROOT_PREFIX: media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      WATCHPACK_POLLING: "true"
      GOTENBERG_URL: http://gotenberg:3000
      FFMPEG_URL: http://ffmpeg:9090
      REVERB_APP_ID: "326162"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      REVERB_PORT: "9000"
      REVERB_SCHEME: "http"
      REVERB_HOST: reverb
      PUSHER_HOST: reverb
      PUSHER_APP_ID: "326162"
      PUSHER_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      PUSHER_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      PUSHER_PORT: "9000"
      PUSHER_SCHEME: "http"
      FRONTEND_URL: http://localhost:3001

    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      seaweedfs-bootstrap:
        condition: service_completed_successfully
    command: php artisan schedule:work
    volumes:
      - ../hive-os-backend:/var/www/html
      - hive-backend-storage:/var/www/html/storage
    networks:
      - hive-network

  # 9. THE FACE (Next.js 16)
  frontend:
    build:
      context: ../hive-os-frontend
      dockerfile: Dockerfile
    container_name: hive-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../hive-os-frontend:/app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
      WATCHPACK_POLLING: "true"
      # 📡 REAL-TIME BROADCASTING
      NEXT_PUBLIC_REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      NEXT_PUBLIC_REVERB_HOST: "localhost"
      NEXT_PUBLIC_REVERB_PORT: "9095"
      NEXT_PUBLIC_REVERB_SCHEME: "http"
      # 🚀Forces Next.js to broadcast outside the container
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    depends_on:
      - backend
    networks:
      - hive-network

  # 10. DATABASE GUI (Adminer)
  adminer:
    image: adminer
    container_name: hive-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hive-network

  # 🚀 11. WEBSOCKET ENGINE (Reverb)
  reverb:
    build:
      context: ../hive-os-backend
      dockerfile: Dockerfile
    container_name: hive-reverb
    restart: unless-stopped
    ports:
      - "127.0.0.1:9095:9000" # Expose Reverb to your local browser
    volumes:
      - ../hive-os-backend:/var/www/html
      - hive-backend-storage:/var/www/html/storage
    environment:
      APP_NAME: "Hive ERP"
      APP_ENV: local
      LARAOWL_ENABLED: "${LARAOWL_ENABLED:-false}"
      APP_KEY: base64:c29tZXJhbmRvbXN0cmluZ2ZvcmRldmVsb3BtZW50MjE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: hive
      DB_USERNAME: hive
      DB_PASSWORD: password
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "326162"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-${REVERB_APP_KEY:-uq8zbsjhgcajsmdiwhc8}}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-${REVERB_APP_SECRET:-u0shs2anhgao3uikmlbq}}"
      REVERB_HOST: localhost
      REVERB_PORT: "9000"
      REVERB_SCHEME: "http"
      FILESYSTEM_DISK: s3
      MEDIA_DISK: s3
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-change-this-seaweedfs-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_URL: http://localhost:${SEAWEEDFS_S3_HOST_PORT:-8333}/${SEAWEEDFS_BUCKET:-hive-local}
      AWS_ROOT_PREFIX: media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      seaweedfs-bootstrap:
        condition: service_completed_successfully
    command: php artisan reverb:start --host=0.0.0.0 --port=9000
    networks:
      - hive-network

  # 🎬 12. MEDIA CONVERTER (FFmpeg API)
  ffmpeg:
    build:
      context: ./ffmpeg-api
      dockerfile: Dockerfile
    container_name: hive-ffmpeg
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=3g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hive-network

  # 📄 13. PDF & DOC CONVERTER (Gotenberg)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: hive-gotenberg
    profiles:
      - docs
    restart: unless-stopped
    networks:
      - hive-network

  # 🧠 14. LOCAL LANGUAGE MODEL (Ollama)
  #
  # The assistant's phrasing layer, self-hosted. Nothing here is metered and no
  # request leaves the machine — which is the whole reason it exists: every
  # hosted free tier has a quota, and this one does not.
  #
  # It is only ever asked to word an answer Hive has already established and
  # verified, so a small model is sufficient; it does not need to know anything.
  ollama:
    image: ollama/ollama:latest
    container_name: hive-ollama
    restart: unless-stopped
    ports:
      # Exposed for `ollama pull` from the host. The backend reaches it over the
      # compose network at http://ollama:11434 instead.
      - "127.0.0.1:11434:11434"
    volumes:
      - hive-ollama-models:/root/.ollama
    environment:
      # Keep the model resident so the first message after an idle spell is not
      # noticeably slower than the rest.
      OLLAMA_KEEP_ALIVE: "24h"
      # One at a time: this GPU is shared with everything else on the machine.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # GPU passthrough is optional. Ollama automatically uses CPU if GPU is not available.
    networks:
      - hive-network

  # ==========================================
  # Monitoring Stack (Profile: monitoring)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hive-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - hive-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9080:9090"
    networks:
      - hive-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: hive-alertmanager
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - hive-network

  grafana:
    image: grafana/grafana:latest
    container_name: hive-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - hive-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - hive-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: hive-node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - hive-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hive-cadvisor
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8089:8080"
    networks:
      - hive-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: hive-postgres-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - DATA_SOURCE_NAME=postgresql://hive:password@db:5432/hive?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - hive-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: hive-redis-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - hive-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: hive-blackbox-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - hive-network

  video-backend:
    image: hive-video-backend:latest
    build:
      context: ./video-backend
    container_name: hive-video-backend
    restart: unless-stopped
    env_file: .video/backend.env
    volumes:
      - hive-video-data:/app/data
    networks: [hive-network]
    depends_on: [video-media]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  video-media:
    image: livekit/livekit-server:v1.13.6
    container_name: hive-video-media
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:17880:7880"
      - "${HIVE_VIDEO_MEDIA_IP:-127.0.0.1}:17881:17881"
      - "${HIVE_VIDEO_MEDIA_IP:-127.0.0.1}:17882:17882/udp"
      - "${HIVE_VIDEO_MEDIA_IP:-127.0.0.1}:17883:17883/udp"
      - "${HIVE_VIDEO_MEDIA_IP:-127.0.0.1}:50200-50240:50200-50240/udp"
    volumes:
      - ./.video/livekit.yaml:/etc/livekit.yaml:ro
    networks: [hive-network]

networks:
  hive-network:
    driver: bridge

volumes:
  hive-prometheus-data:
  hive-grafana-data:
  hive-db-data:
  hive-search-data:
  hive-seaweedfs-data:
  hive-backend-storage:
  hive-ollama-models:

  hive-video-data:
    external: true
    name: hive-video_video-data
